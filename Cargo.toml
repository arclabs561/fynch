[package]
name = "fynch"
version = "0.5.0"
authors = ["Arc <attobop@gmail.com>"]
edition = "2021"
rust-version = "1.82"
description = "Differentiable sorting and ranking"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/fynch"
homepage = "https://github.com/arclabs561/fynch"
documentation = "https://docs.rs/fynch"
keywords = ["sorting", "ranking", "differentiable", "fenchel-young", "fastsoftsort"]
categories = ["algorithms", "science", "mathematics"]
publish = true
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/examples/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[features]
default = []
# Gumbel-Softmax for stochastic top-k
gumbel = ["dep:drawset", "dep:rand"]
# No-op since logp became a required dependency; kept so that crates enabling
# it keep building. Remove at the next breaking release.
logp = []

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
rand = { version = "0.9", optional = true }
logp = "0.3"

# Optional: SIMD primitives
# Optional: Stochastic sampling
drawset = { version = "0.1.2", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
rand = "0.9"
rankops = { version = "0.2", default-features = false }
serde_json = "1.0"

[[bench]]
name = "fy_bench"
harness = false

[[bench]]
name = "sinkhorn_bench"
harness = false
